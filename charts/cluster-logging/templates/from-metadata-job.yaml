{{- if .Values.platformMetadata.enabled }}
# Apply CloudWatch credentials + ClusterLogForwarder from bootstrap ConfigMap.
# See: validated-pattern-terraform-rosa docs/architecture/platform-metadata-irsa.md
apiVersion: batch/v1
kind: Job
metadata:
  name: logging-from-metadata
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: {{ .Values.syncwave | default 3 | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logging-from-metadata
    spec:
      restartPolicy: OnFailure
      serviceAccountName: logging-from-metadata
      containers:
        - name: apply
          image: {{ .Values.platformMetadata.applyJob.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: METADATA_NS
              value: {{ .Values.platformMetadata.namespace | quote }}
            - name: METADATA_NAME
              value: {{ .Values.platformMetadata.name | quote }}
            - name: ROLE_ARN_KEY
              value: {{ .Values.platformMetadata.loggingRoleArnKey | quote }}
            - name: CLUSTER_NAME_KEY
              value: {{ .Values.platformMetadata.clusterNameKey | quote }}
            - name: AWS_REGION_KEY
              value: {{ .Values.platformMetadata.awsRegionKey | quote }}
            - name: LOGGING_SA
              value: {{ .Values.serviceAccount | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              echo "Waiting for ConfigMap ${METADATA_NS}/${METADATA_NAME}..."
              for i in $(seq 1 60); do
                if oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" >/dev/null

              ROLE_ARN=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o jsonpath="{.data.${ROLE_ARN_KEY}}")
              CLUSTER_NAME=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o jsonpath="{.data.${CLUSTER_NAME_KEY}}")
              AWS_REGION=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o jsonpath="{.data.${AWS_REGION_KEY}}")
              if [[ -z "${ROLE_ARN}" ]]; then
                echo "ConfigMap ${METADATA_NAME} missing data.${ROLE_ARN_KEY} (enable_cloudwatch_logging + bootstrap)" >&2
                exit 1
              fi
              if [[ -z "${CLUSTER_NAME}" ]]; then
                echo "ConfigMap ${METADATA_NAME} missing data.${CLUSTER_NAME_KEY}" >&2
                exit 1
              fi
              if [[ -z "${AWS_REGION}" ]]; then
                echo "ConfigMap ${METADATA_NAME} missing data.${AWS_REGION_KEY}" >&2
                exit 1
              fi

              echo "Applying cloudwatch-credentials from platform metadata"
              oc -n openshift-logging create secret generic cloudwatch-credentials \
                --from-literal=credentials="${ROLE_ARN}" --dry-run=client -o yaml | oc apply -f -

              clf_file="$(mktemp)"
              cat >"${clf_file}" <<YAML
              apiVersion: observability.openshift.io/v1
              kind: ClusterLogForwarder
              metadata:
                name: vector
                namespace: openshift-logging
                annotations:
                  observability.openshift.io/log-level: info
              spec:
                managementState: Managed
                outputs:
                  - cloudwatch:
                      authentication:
                        iamRole:
                          roleARN:
                            key: credentials
                            secretName: cloudwatch-credentials
                          token:
                            from: serviceAccount
                        type: iamRole
                      groupName: /${CLUSTER_NAME}/infrastructure
                      region: ${AWS_REGION}
                    name: output-cloudwatch-infrastructure
                    type: cloudwatch
                  - cloudwatch:
                      authentication:
                        iamRole:
                          roleARN:
                            key: credentials
                            secretName: cloudwatch-credentials
                          token:
                            from: serviceAccount
                        type: iamRole
                      groupName: /${CLUSTER_NAME}/{.kubernetes.namespace_name||"unknown"}
                      region: ${AWS_REGION}
                    name: output-cloudwatch-namespace-all
                    type: cloudwatch
                pipelines:
                  - name: input-cloudwatch-infrastructure
                    inputRefs:
                      - infrastructure
                    outputRefs:
                      - output-cloudwatch-infrastructure
                  - name: input-cloudwatch-namespace-all
                    inputRefs:
                      - application
                    outputRefs:
                      - output-cloudwatch-namespace-all
                serviceAccount:
                  name: ${LOGGING_SA}
              YAML
              sed -e 's/^              //' "${clf_file}" | oc apply -f -
              rm -f "${clf_file}"
              echo "CloudWatch logging applied from platform metadata"
{{- end }}