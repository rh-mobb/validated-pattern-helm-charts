{{- /*
  guardrails/apikey-externalsecret.yaml — the MaaS API key NemoGuardrails uses for its LLM judge
  Why:       For each input or output check, NemoGuardrails asks a judge model (guardrails.judge.model)
             through the MaaS gateway whether the text breaks policy. That call is an ordinary MaaS
             client call, so it needs a MaaS API key. The key is bound to one MaaS subscription
             (e.g. gpt-4o-mini-guardrails), which sets its rate limit and where usage is metered.
             The key is created by hand (POST /maas-api/v1/api-keys), stored in AWS Secrets Manager,
             and synced here as Secret nemoguardrails-api-key (key `key`), then read as OPENAI_API_KEY.
             The provider key (e.g. OpenAI) never reaches this namespace; MaaS holds it.
  Gated by:  .Values.guardrails.enabled
  Ordering:  sync-wave 0 — before the NemoGuardrails CR (wave 2).
             The AWS SM key must be in Terraform additional_secrets for ESO IRSA to read it.
  Origin:    rhoai-demo-guide setup-mlflow-tracing.sh Phase 3.3 (which minted a 7-day key imperatively)
*/ -}}
{{- if .Values.guardrails.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nemoguardrails-api-key
  namespace: {{ include "genai-workspace.namespace" . }}
  labels:
    {{- include "genai-workspace.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.guardrails.apiKey.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: nemoguardrails-api-key
  data:
    - secretKey: key
      remoteRef:
        key: {{ required "guardrails.apiKey.awsSecretKey is required (AWS SM secret holding the judge's MaaS API key)" .Values.guardrails.apiKey.awsSecretKey }}
        property: {{ .Values.guardrails.apiKey.property }}
{{- end }}
