{{- /*
  rag/pgvector-credentials.yaml — password for the workspace's pgvector database
  Why:       The script generated a random password with `oc create secret`. Helm can't do that
             without a new random value on every Argo render, which causes endless drift. Instead:
               passwordSource=generator: an ESO Password generator creates it ONCE
                 (refreshInterval "0" = never regenerate), stored in Secret genai-pgvector-credentials
               passwordSource=awsSecret: read property `password` from AWS Secrets Manager
             Caveat: if the ExternalSecret is deleted and recreated in generator mode, a new password
             is generated but the database on the PVC keeps the old one. Delete the PVC too, or use
             awsSecret mode for long-lived data.
  Gated by:  .Values.playground.enabled (the vector store backs the Playground's RAG)
  Ordering:  sync-wave 0 — before the pgvector Deployment (wave 1) and OGXServer (wave 2).
  Origin:    rhoai-demo-guide setup-mlflow-tracing.sh Phase 0.2 (Secret genai-pgvector-credentials)
*/ -}}
{{- if .Values.playground.enabled }}
{{- $pg := .Values.rag.pgvector }}
{{- if eq $pg.passwordSource "generator" }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: genai-pgvector-password
  namespace: {{ include "genai-workspace.namespace" . }}
  labels:
    {{- include "genai-workspace.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: genai-pgvector-credentials
  namespace: {{ include "genai-workspace.namespace" . }}
  labels:
    {{- include "genai-workspace.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # "0" = generate once, never refresh (a rotated password would no longer match the database).
  refreshInterval: "0"
  target:
    name: genai-pgvector-credentials
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: genai-pgvector-password
{{- else if eq $pg.passwordSource "awsSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: genai-pgvector-credentials
  namespace: {{ include "genai-workspace.namespace" . }}
  labels:
    {{- include "genai-workspace.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: genai-pgvector-credentials
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "rag.pgvector.awsSecretKey is required when passwordSource=awsSecret" $pg.awsSecretKey }}
        property: password
{{- else }}
{{- fail "rag.pgvector.passwordSource must be \"generator\" or \"awsSecret\"" }}
{{- end }}
{{- end }}
