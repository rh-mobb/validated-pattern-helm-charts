namespace: llm
createNamespace: true
governanceNamespace: models-as-a-service

gatewayRef:
  name: maas-default-gateway
  namespace: openshift-ingress

model:
  name: simulated
  displayName: "Facebook OPT 125M (Simulated)"
  description: "CPU-only simulator for testing MaaS without a real LLM"
  uri: "hf://sshleifer/tiny-gpt2"
  modelName: "facebook/opt-125m"
  replicas: 1

  container:
    image: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
    command: ["/app/llm-d-inference-sim"]
    args:
      - --port
      - "8000"
      - --model
      - facebook/opt-125m
      - --mode
      - random
      - --ssl-certfile
      - /var/run/kserve/tls/tls.crt
      - --ssl-keyfile
      - /var/run/kserve/tls/tls.key
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gpu:
    enabled: false
    count: 1

# -- Who may call this model at all (MaaSAuthPolicy subjects). Must include every team that owns a tier.
access:
  groups:
    - system:authenticated
  users: []

# -- Subscription tiers (one MaaSSubscription "<model.name>-<tier>" per enabled entry).
# When set, the legacy `subscription.free/premium` blocks below are ignored. Per tier:
#   enabled, tokenLimit, tokenWindow, priority, displayName (optional),
#   owners: {groups: [], users: []}  -> who may create API keys on this tier (default system:authenticated)
# Example:
#   subscriptions:
#     free:    {enabled: true, tokenLimit: 100,   tokenWindow: 1m, priority: 10}
#     premium: {enabled: true, tokenLimit: 100000, tokenWindow: 1m, priority: 20}
#     legal:   {enabled: true, tokenLimit: 50000, tokenWindow: 1m, priority: 20,
#               owners: {groups: [legal-team]}}
subscriptions: {}

# -- Legacy fixed tiers (pre-0.3.0). Rendered as "<model.name>-free" / "-premium" when `subscriptions` is empty.
subscription:
  free:
    enabled: true
    tokenLimit: 100
    tokenWindow: 1m
    priority: 10
  premium:
    enabled: true
    tokenLimit: 100000
    tokenWindow: 1m
    priority: 20
