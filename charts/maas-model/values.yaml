namespace: llm
governanceNamespace: models-as-a-service

gatewayRef:
  name: maas-default-gateway
  namespace: openshift-ingress

model:
  name: simulated
  displayName: "Facebook OPT 125M (Simulated)"
  description: "CPU-only simulator for testing MaaS without a real LLM"
  uri: "hf://sshleifer/tiny-gpt2"
  modelName: "facebook/opt-125m"
  replicas: 1

  container:
    image: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
    command: ["/app/llm-d-inference-sim"]
    args:
      - --port
      - "8000"
      - --model
      - facebook/opt-125m
      - --mode
      - random
      - --ssl-certfile
      - /var/run/kserve/tls/tls.crt
      - --ssl-keyfile
      - /var/run/kserve/tls/tls.key
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gpu:
    enabled: false
    count: 1

subscription:
  free:
    enabled: true
    tokenLimit: 100
    tokenWindow: 1m
    priority: 10
  premium:
    enabled: true
    tokenLimit: 100000
    tokenWindow: 1m
    priority: 20
