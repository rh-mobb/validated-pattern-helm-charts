{{- /*
  llminferenceservice.yaml — the self-hosted model server (KServe LLMInferenceService, e.g. vLLM)
  Why:       Runs the model pods and attaches them to the MaaS gateway (router.gateway.refs).
             enable-auth makes the endpoint require auth, so it can only be reached through MaaS.
             With gpu.enabled: GPU toleration, nvidia.com/gpu requests/limits, a 2Gi /dev/shm (vLLM
             needs shared memory), and longer probe delays while weights download and load.
  Ordering:  sync-wave 1 — after the namespace; MaaS governance objects (wave 3) reference it.
*/ -}}
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
    openshift.io/display-name: {{ .Values.model.displayName | quote }}
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    uri: {{ .Values.model.uri }}
    name: {{ .Values.model.modelName }}
  replicas: {{ .Values.model.replicas }}
  router:
    route: {}
    gateway:
      refs:
        - name: {{ .Values.gatewayRef.name }}
          namespace: {{ .Values.gatewayRef.namespace }}
  template:
    {{- if .Values.model.gpu.enabled }}
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    {{- end }}
    containers:
      - name: main
        image: {{ .Values.model.container.image | quote }}
        imagePullPolicy: Always
        {{- with .Values.model.container.command }}
        command: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.model.container.args }}
        args: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.model.container.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: {{ .Values.model.gpu.enabled | ternary 300 30 }}
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: {{ .Values.model.gpu.enabled | ternary 300 10 }}
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 30
        resources:
          requests:
            {{- toYaml .Values.model.container.resources.requests | nindent 12 }}
            {{- if .Values.model.gpu.enabled }}
            nvidia.com/gpu: {{ .Values.model.gpu.count | quote }}
            {{- end }}
          limits:
            {{- toYaml .Values.model.container.resources.limits | nindent 12 }}
            {{- if .Values.model.gpu.enabled }}
            nvidia.com/gpu: {{ .Values.model.gpu.count | quote }}
            {{- end }}
        {{- if .Values.model.gpu.enabled }}
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
        {{- end }}
    {{- if .Values.model.gpu.enabled }}
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
    {{- end }}
