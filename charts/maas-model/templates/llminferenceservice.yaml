apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
spec:
  model:
    uri: {{ .Values.model.uri }}
    name: {{ .Values.model.modelName }}
  replicas: {{ .Values.model.replicas }}
  router:
    route: {}
    gateway:
      refs:
        - name: {{ .Values.gatewayRef.name }}
          namespace: {{ .Values.gatewayRef.namespace }}
  template:
    containers:
      - name: main
        image: {{ .Values.model.container.image | quote }}
        imagePullPolicy: Always
        {{- with .Values.model.container.command }}
        command: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.model.container.args }}
        args: {{ toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
        resources:
          {{- toYaml .Values.model.container.resources | nindent 10 }}
          {{- if .Values.model.gpu.enabled }}
          {{- if not .Values.model.container.resources.limits }}
          limits:
          {{- end }}
            nvidia.com/gpu: {{ .Values.model.gpu.count | quote }}
          {{- end }}
    {{- if .Values.model.gpu.enabled }}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    {{- end }}
