{{- /*
  mlflow.yaml — the cluster's single MLflow instance (GenAI trace + experiment store)
  Why:       genai-workspace instances export OpenTelemetry traces (Playground LLM calls and
             NemoGuardrails rail decisions) to MLflow. The RHOAI MLflow operator only accepts ONE
             MLflow CR, and it must be named "mlflow". The operator runs the server in
             redhat-ods-applications (https://mlflow.redhat-ods-applications.svc:8443).
             workspaceLabelSelector uses a label instead of one namespace name, so any number of
             team namespaces labelled <workspaceLabel>=true become isolated MLflow workspaces.
             MLflow uses kubernetes-auth: a user or SA only sees workspaces it has RBAC on.
  Gated by:  .Values.mlflow.enabled
  Ordering:  sync-wave 0 — needs the mlflows.mlflow.opendatahub.io CRD (DSC mlflowoperator:
             Managed). SkipDryRunOnMissingResource lets the first sync succeed before the CRD exists.
  Origin:    rhoai-demo-guide setup-mlflow-tracing.sh Phase 1.3 (the label selector replaces the
             script's single-namespace selector patch)
*/ -}}
{{- if .Values.mlflow.enabled }}
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  # Mandatory singleton name — the operator rejects any other name.
  name: mlflow
  labels:
    {{- include "rhai-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
spec:
  backendStoreUri: {{ .Values.mlflow.backendStoreUri | quote }}
  serveArtifacts: true
  artifactsDestination: {{ .Values.mlflow.artifactsDestination | quote }}
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.mlflow.storageSize }}
  workspaceLabelSelector:
    matchLabels:
      {{ .Values.mlflow.workspaceLabel }}: "true"
{{- end }}
