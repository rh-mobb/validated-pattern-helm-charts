{{- /*
  telemetry-job.yaml — turns on MaaS telemetry (and optionally usage logging) via a patch Job
  Why:       MaaSTenantConfig and the MaaS Config CR are created and owned by the RHOAI/MaaS
             operator, so this chart can't render them. A PostSync Job merge-patches only the
             telemetry fields:
               - spec.telemetry.enabled / metrics.captureUser: token and usage metrics per user,
                 which is the basis for per-team chargeback
               - spec.usageLogging (MaaS Config): ships per-request usage records to the "usage"
                 LokiStack, when usageLogging is enabled
             Patches are best-effort: if the CRs don't exist yet the Job logs and exits 0, and the
             next sync applies them.
  Gated by:  .Values.telemetry.enabled
  Ordering:  RBAC at sync-wave 0; Job is a PostSync hook at wave 5, after usage logging (waves 1-4)
             exists.
  Origin:    moved from maas-alerting-additional-config/templates/telemetry-job.yaml
             (namespace and tenant name are now values; image key is jobImage)
*/ -}}
{{- if .Values.telemetry.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-telemetry-config
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    {{- include "rhai-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Least privilege: only get/patch on the two MaaS config CRs the Job touches.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-telemetry-config
  labels:
    {{- include "rhai-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maastenantconfigs"]
    verbs: ["get", "patch"]
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["configs"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-telemetry-config
  labels:
    {{- include "rhai-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maas-telemetry-config
subjects:
  - kind: ServiceAccount
    name: maas-telemetry-config
    namespace: {{ .Values.monitoringNamespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-telemetry-config
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    {{- include "rhai-observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: maas-telemetry-config
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: {{ .Values.jobImage }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            # oc needs a writable HOME for its config; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Enabling telemetry on MaaSTenantConfig..."
              oc patch maastenantconfig {{ .Values.telemetry.tenantConfigName }} -n {{ .Values.telemetry.maasNamespace }} \
                --type=merge -p '{
                  "spec": {
                    "telemetry": {
                      "enabled": true,
                      "metrics": {
                        "captureUser": {{ .Values.telemetry.captureUser }}
                      }
                    }
                  }
                }' 2>/dev/null && echo "MaaSTenantConfig patched" || echo "MaaSTenantConfig not found (may not exist yet)"

              {{- if .Values.usageLogging.enabled }}
              echo "Enabling usage logging on MaaS Config..."
              oc patch configs.maas.opendatahub.io default \
                --type=merge -p '{"spec":{"usageLogging":true}}' 2>/dev/null && echo "Usage logging enabled" || echo "MaaS Config not found (may not exist yet)"
              {{- end }}

              echo "Done"
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
