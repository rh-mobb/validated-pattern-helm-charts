{{- /*
  rbac.yaml — read-only identity for the verification Job
  Why:       The Job only reads state (gateway, deployments, MaaS CRs, Authorino, LokiStack, routes).
             No write verbs. Its SA token is also used as the caller identity for maas-api
             (list models, create ephemeral 5-minute API keys).
  Ordering:  sync-wave 0 — before the Job (PostSync wave 10).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-verify
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-verify
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "list"]
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maasmodelrefs", "maasauthpolicies", "maassubscriptions", "maastenantconfigs"]
    verbs: ["get", "list"]
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "list"]
  - apiGroups: ["operator.authorino.kuadrant.io"]
    resources: ["authorinos"]
    verbs: ["get", "list"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["lokistacks"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-verify
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maas-verify
subjects:
  - kind: ServiceAccount
    name: maas-verify
    namespace: {{ .Values.namespace }}
