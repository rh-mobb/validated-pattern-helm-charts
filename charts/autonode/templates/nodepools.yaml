{{- if .Values.enabled }}
{{- range .Values.nodePools }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .name }}
spec:
  template:
    {{- with .labels }}
    metadata:
      labels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
          {{- range .instanceTypes }}
            - {{ . | quote }}
          {{- end }}
        - key: karpenter.sh/capacity-type
          operator: In
          values:
          {{- range .capacityTypes }}
            - {{ . | quote }}
          {{- end }}
      nodeClassRef:
        {{- toYaml .nodeClassRef | nindent 8 }}
{{- end }}
{{- end }}
