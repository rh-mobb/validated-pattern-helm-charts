# Destination namespace for the operator. app-of-apps-infrastructure sets
# CreateNamespace=false, so the chart must create this when createNamespace=true.
namespace: openshift-cudn-bgp-routing
createNamespace: true

namePrefix: openshift-cudn-bgp-routing-

image:
  # Used when buildOperator.enabled=false. When buildOperator is enabled the
  # deployment image is derived from the in-cluster ImageStream instead.
  repository: image-registry.openshift-image-registry.svc:5000/openshift-cudn-bgp-routing/operator
  tag: dev
  pullPolicy: Always

# Optional in-cluster build of the operator image into the local registry.
# Intended for PoC / demo clusters that do not yet consume a published image.
# Requires the OpenShift image registry (managementState=Managed).
buildOperator:
  enabled: false
  imageStreamName: operator
  git:
    uri: https://github.com/openshift/bgp-cloud-connector.git
    ref: main
  contextDir: ""
  dockerfilePath: Dockerfile
  runPolicy: Serial
  # Optional GitHub webhook trigger secret name (in this namespace).
  githubTriggerSecret: ""
  buildArgs: {}
  # Go module + multi-stage Docker builds need generous memory.
  # Operator Dockerfile runs `make build-operator` (Go 1.26 + aws-sdk).
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

serviceAccount:
  name: controller-manager
  # When externalSecret.enabled=true, omit eks.amazonaws.com/role-arn here —
  # the bgp-config-apply Job sets it from the ESO-synced Secret (issue #51).
  annotations: {}

metricsPort: 8443

# Sync Terraform-owned BGP params from AWS Secrets Manager via ESO.
# Secret JSON keys: role_arn, region, route_server_id, route_server_ids.
# Requires external-secrets-operator + ClusterSecretStore aws-secrets-manager.
externalSecret:
  enabled: false
  secretStore: aws-secrets-manager
  # Optional; when empty, Job reads bgpConfigSecretName from platform metadata.
  remoteKey: ""
  targetSecretName: bgp-operator-config
  refreshInterval: 1h
  applyJob:
    image: registry.redhat.io/openshift4/ose-cli:latest
  platformMetadata:
    enabled: true
    name: rosa-platform-metadata
    namespace: openshift-gitops
    remoteKeyField: bgpConfigSecretName

cudnBgpConfig:
  enabled: false
  # Required by the bgp-cloud-connector CRD. AWS when using Route Server / ESO.
  platform: AWS
  localASN: 65001
  livenessDetection: bgp-keepalive
  routerNodeSelector:
    bgp_router: "true"
  # When externalSecret.enabled=true, Helm skips CUDNBgpConfig; the Job applies
  # the full CR including platform + aws.* from the ESO Secret.
  aws:
    region: ""
    routeServerIDs: []

cudnBgpRoutings: []
