apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cudn-bgp.namePrefix" . }}controller-manager
  namespace: {{ include "cudn-bgp.namespace" . }}
  labels:
    control-plane: controller-manager
    {{- include "cudn-bgp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      {{- include "cudn-bgp.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "cudn-bgp.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
        - --metrics-bind-address=:{{ .Values.metricsPort }}
        - --leader-elect
        - --health-probe-bind-address=:8081
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts: []
      volumes: []
      serviceAccountName: {{ include "cudn-bgp.namePrefix" . }}{{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
