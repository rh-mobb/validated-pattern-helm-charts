{{- /* When remoteKey is empty, bgp-config-apply Job creates ExternalSecret from platform metadata. */}}
{{- if and .Values.externalSecret.enabled .Values.externalSecret.remoteKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetSecretName }}
  namespace: {{ include "cudn-bgp.namespace" . }}
  labels:
    {{- include "cudn-bgp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: role_arn
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: role_arn
    - secretKey: region
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: region
    - secretKey: route_server_id
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: route_server_id
    - secretKey: route_server_ids
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: route_server_ids
{{- end }}
