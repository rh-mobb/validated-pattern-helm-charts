{{- if .Values.platformMetadata.enabled }}
# Create ClusterSecretStore with AWS region from bootstrap ConfigMap (cannot come from
# Secrets Manager — CSS needs a region before it can read SM).
# See: validated-pattern-terraform-rosa docs/architecture/platform-metadata-irsa.md
apiVersion: batch/v1
kind: Job
metadata:
  name: eso-css-from-metadata
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eso-css-from-metadata
    spec:
      restartPolicy: OnFailure
      serviceAccountName: eso-css-from-metadata
      containers:
        - name: apply
          image: {{ .Values.platformMetadata.applyJob.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: METADATA_NS
              value: {{ .Values.platformMetadata.namespace | quote }}
            - name: METADATA_NAME
              value: {{ .Values.platformMetadata.name | quote }}
            - name: REGION_KEY
              value: {{ .Values.platformMetadata.regionKey | quote }}
            - name: CSS_NAME
              value: {{ .Values.secretStore.name | quote }}
            - name: ESO_NS
              value: {{ .Values.namespace | quote }}
            - name: ESO_SA
              value: {{ .Values.serviceAccount.name | quote }}
            - name: WEBHOOK_NS
              value: {{ .Values.secretStore.webhookWait.namespace | quote }}
            - name: WEBHOOK_SERVICE
              value: {{ .Values.secretStore.webhookWait.serviceName | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.secretStore.webhookWait.maxAttempts | quote }}
            - name: SLEEP_SECONDS
              value: {{ .Values.secretStore.webhookWait.sleepSeconds | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              echo "Waiting for ConfigMap ${METADATA_NS}/${METADATA_NAME}..."
              for i in $(seq 1 60); do
                if oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" >/dev/null

              REGION=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o "jsonpath={.data.${REGION_KEY}}")
              if [[ -z "${REGION}" ]]; then
                REGION=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o jsonpath='{.data.awsRegion}')
              fi
              if [[ -z "${REGION}" ]]; then
                echo "ConfigMap ${METADATA_NAME} missing data.${REGION_KEY} (run bootstrap)" >&2
                exit 1
              fi

              echo "Waiting for ${WEBHOOK_NS}/${WEBHOOK_SERVICE} Endpoints..."
              for i in $(seq 1 "${MAX_ATTEMPTS}"); do
                IPS=$(oc -n "${WEBHOOK_NS}" get endpoints "${WEBHOOK_SERVICE}" \
                  -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
                if [[ -z "${IPS}" ]]; then
                  IPS=$(oc -n "${WEBHOOK_NS}" get endpointslices \
                    -l kubernetes.io/service-name="${WEBHOOK_SERVICE}" \
                    -o jsonpath='{.items[*].endpoints[*].addresses[*]}' 2>/dev/null || true)
                fi
                if [[ -n "${IPS}" ]]; then
                  echo "Webhook Endpoints ready: ${IPS}"
                  break
                fi
                echo "attempt ${i}/${MAX_ATTEMPTS}: no webhook endpoints yet"
                sleep "${SLEEP_SECONDS}"
                if [[ "${i}" -eq "${MAX_ATTEMPTS}" ]]; then
                  echo "Timed out waiting for ${WEBHOOK_NS}/${WEBHOOK_SERVICE} Endpoints" >&2
                  exit 1
                fi
              done

              echo "Applying ClusterSecretStore ${CSS_NAME} region=${REGION}"
              css_file="$(mktemp)"
              printf '%s\n' \
                'apiVersion: external-secrets.io/v1' \
                'kind: ClusterSecretStore' \
                'metadata:' \
                "  name: ${CSS_NAME}" \
                'spec:' \
                '  provider:' \
                '    aws:' \
                '      service: SecretsManager' \
                "      region: ${REGION}" \
                '      auth:' \
                '        jwt:' \
                '          serviceAccountRef:' \
                "            name: ${ESO_SA}" \
                "            namespace: ${ESO_NS}" >"${css_file}"
              oc apply -f "${css_file}"
              rm -f "${css_file}"
              echo "ClusterSecretStore applied from platform metadata awsRegion"
{{- end }}
