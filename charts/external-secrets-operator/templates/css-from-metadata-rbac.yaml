{{- if .Values.platformMetadata.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-css-from-metadata
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-css-from-metadata-read
  namespace: {{ .Values.platformMetadata.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.platformMetadata.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-css-from-metadata-read
  namespace: {{ .Values.platformMetadata.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-css-from-metadata-read
subjects:
  - kind: ServiceAccount
    name: eso-css-from-metadata
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-css-from-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["clustersecretstores"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-css-from-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-css-from-metadata
subjects:
  - kind: ServiceAccount
    name: eso-css-from-metadata
    namespace: {{ .Values.namespace }}
{{- end }}
