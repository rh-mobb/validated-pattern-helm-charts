{{- if or .Values.serviceAccount.roleArn .Values.platformMetadata.enabled }}
{{- /* Wait Job needs to observe ESO operand webhook Endpoints (OLM-managed ns). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-webhook-wait
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-webhook-wait
  annotations:
    argocd.argoproj.io/sync-wave: "4"
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-webhook-wait
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-webhook-wait
subjects:
  - kind: ServiceAccount
    name: eso-webhook-wait
    namespace: {{ .Values.namespace }}
{{- end }}
