namespace: external-secrets-operator

subscription:
  name: openshift-external-secrets-operator
  channel: stable-v1
  installPlanApproval: Manual
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: ""

serviceAccount:
  name: external-secrets-sa
  # Break-glass / legacy: set explicitly. Prefer platformMetadata.enabled (bootstrap ConfigMap).
  roleArn: ""

# Read secretsManagerRoleArn from bootstrap ConfigMap rosa-platform-metadata.
# Doc: validated-pattern-terraform-rosa docs/architecture/platform-metadata-irsa.md
platformMetadata:
  enabled: false
  name: rosa-platform-metadata
  namespace: openshift-gitops
  roleArnKey: secretsManagerRoleArn
  applyJob:
    image: registry.redhat.io/openshift4/ose-cli:latest

secretStore:
  name: aws-secrets-manager
  region: ap-southeast-4
  secretName: connectivity-link-route53-credentials

target:
  # When false, skip the Kuadrant aws-credentials ExternalSecret (ClusterSecretStore still created).
  enabled: true
  namespace: istio-system
  secretName: aws-credentials
  refreshInterval: 1h

helper-status-checker:
  enabled: true
  approver: true
  checks:
    - operatorName: external-secrets-operator
      subscriptionName: openshift-external-secrets-operator
      namespace:
        name: external-secrets-operator
      serviceAccount:
        name: "external-secrets-install-check"
