# Using sub-chart helper-installplan-approver
helper-status-checker:
  approver: true
  enabled: true
  checks:
    - operatorName: aws-efs-csi-driver-operator
      subscriptionName: aws-efs-csi-driver-operator
      namespace:
        name: openshift-cluster-csi-drivers
      serviceAccount:
        name: "status-checker"
helper-operator:
  enabled: true
  operators:
    aws-efs-csi-driver-operator:
      enabled: true
      namespace:
        name: openshift-cluster-csi-drivers
      subscription:
        channel: stable
        approval: Manual
        operatorName: aws-efs-csi-driver-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
      operatorgroup:
        create: true
        notownnamespace: true

# Break-glass / legacy: set explicitly. Prefer platformMetadata.enabled (bootstrap ConfigMap).
roleArn: ""
fileSystemId: ""

storageClass:
  create: true
  name: efs-sc
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  directoryPerms: "700"

# Read efsCsiRoleArn + efsFileSystemId from bootstrap ConfigMap rosa-platform-metadata.
# Doc: validated-pattern-terraform-rosa docs/architecture/platform-metadata-irsa.md
platformMetadata:
  enabled: false
  name: rosa-platform-metadata
  namespace: openshift-gitops
  roleArnKey: efsCsiRoleArn
  fileSystemIdKey: efsFileSystemId
  applyJob:
    image: registry.redhat.io/openshift4/ose-cli:latest
