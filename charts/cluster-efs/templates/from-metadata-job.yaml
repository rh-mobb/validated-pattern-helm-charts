{{- if .Values.platformMetadata.enabled }}
# Apply EFS CSI cloud-credentials Secret + StorageClass from bootstrap ConfigMap.
# See: validated-pattern-terraform-rosa docs/architecture/platform-metadata-irsa.md
apiVersion: batch/v1
kind: Job
metadata:
  name: efs-from-metadata
  namespace: openshift-cluster-csi-drivers
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efs-from-metadata
    spec:
      restartPolicy: OnFailure
      serviceAccountName: efs-from-metadata
      containers:
        - name: apply
          image: {{ .Values.platformMetadata.applyJob.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: METADATA_NS
              value: {{ .Values.platformMetadata.namespace | quote }}
            - name: METADATA_NAME
              value: {{ .Values.platformMetadata.name | quote }}
            - name: ROLE_ARN_KEY
              value: {{ .Values.platformMetadata.roleArnKey | quote }}
            - name: FS_ID_KEY
              value: {{ .Values.platformMetadata.fileSystemIdKey | quote }}
            - name: STORAGE_CLASS_NAME
              value: {{ .Values.storageClass.name | quote }}
            - name: DIRECTORY_PERMS
              value: {{ .Values.storageClass.directoryPerms | quote }}
            - name: SC_UID
              value: {{ .Values.storageClass.uid | quote }}
            - name: SC_GID
              value: {{ .Values.storageClass.gid | quote }}
            - name: RECLAIM_POLICY
              value: {{ .Values.storageClass.reclaimPolicy | quote }}
            - name: VOLUME_BINDING_MODE
              value: {{ .Values.storageClass.volumeBindingMode | quote }}
            - name: CREATE_STORAGE_CLASS
              value: {{ .Values.storageClass.create | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              echo "Waiting for ConfigMap ${METADATA_NS}/${METADATA_NAME}..."
              for i in $(seq 1 60); do
                if oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" >/dev/null

              ROLE_ARN=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o jsonpath="{.data.${ROLE_ARN_KEY}}")
              FS_ID=$(oc -n "${METADATA_NS}" get configmap "${METADATA_NAME}" -o jsonpath="{.data.${FS_ID_KEY}}")
              if [[ -z "${ROLE_ARN}" ]]; then
                echo "ConfigMap ${METADATA_NAME} missing data.${ROLE_ARN_KEY} (run bootstrap with enable_efs)" >&2
                exit 1
              fi
              if [[ -z "${FS_ID}" ]]; then
                echo "ConfigMap ${METADATA_NAME} missing data.${FS_ID_KEY} (run bootstrap with enable_efs)" >&2
                exit 1
              fi

              echo "Applying aws-efs-cloud-credentials from platform metadata"
              creds_file="$(mktemp)"
              printf '%s\n' '[default]' "role_arn = ${ROLE_ARN}" 'web_identity_token_file = /var/run/secrets/openshift/serviceaccount/token' >"${creds_file}"
              oc -n openshift-cluster-csi-drivers create secret generic aws-efs-cloud-credentials \
                --from-file=credentials="${creds_file}" --dry-run=client -o yaml | oc apply -f -
              rm -f "${creds_file}"

              if [[ "${CREATE_STORAGE_CLASS}" == "true" ]]; then
                echo "Applying StorageClass ${STORAGE_CLASS_NAME} for ${FS_ID}"
                sc_file="$(mktemp)"
                {
                  printf '%s\n' \
                    'apiVersion: storage.k8s.io/v1' \
                    'kind: StorageClass' \
                    'metadata:' \
                    "  name: ${STORAGE_CLASS_NAME}" \
                    'provisioner: efs.csi.aws.com' \
                    'parameters:' \
                    '  provisioningMode: efs-ap' \
                    "  fileSystemId: ${FS_ID}" \
                    "  directoryPerms: \"${DIRECTORY_PERMS}\""
                  if [[ -n "${SC_UID}" ]]; then
                    printf '%s\n' "  uid: \"${SC_UID}\""
                  fi
                  if [[ -n "${SC_GID}" ]]; then
                    printf '%s\n' "  gid: \"${SC_GID}\""
                  fi
                  printf '%s\n' \
                    "reclaimPolicy: ${RECLAIM_POLICY}" \
                    "volumeBindingMode: ${VOLUME_BINDING_MODE}" \
                    'allowVolumeExpansion: true'
                } >"${sc_file}"
                oc apply -f "${sc_file}"
                rm -f "${sc_file}"
              fi
              echo "EFS CSI credentials and StorageClass applied from platform metadata"
{{- end }}
