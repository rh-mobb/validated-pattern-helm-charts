{{- /*
  redis.yaml — DEPRECATED (chart maas-alerting-additional-config is deprecated)
  Why:       Kept so existing installs keep working during migration.
  Replaced:  maas-additional-config >= 0.3.0 (redis.enabled). Resource names are identical, so Argo CD hands them over in place.
*/ -}}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.redis.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.redis.namespace }}
  labels:
    app: redis
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args:
            - /usr/bin/run-redis
            - --save ""
            - --appendonly no
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: {{ .Values.redis.namespace }}
  labels:
    app: redis
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-config
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  URL: "redis://redis-service.{{ .Values.redis.namespace }}.svc:6379"
{{- end }}
