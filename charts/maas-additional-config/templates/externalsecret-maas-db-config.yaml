{{- /*
  externalsecret-maas-db-config.yaml — database connection URL for maas-api
  Why:       maas-api runs in the gateway infra namespace and reads DB_CONNECTION_URL from Secret
             maas-db-config. It comes from the same AWS SM secret as postgres-creds, so the
             database and its client always agree on credentials.
  Ordering:  sync-wave 0 — before maas-api needs it. The namespace is created by the RHOAI/MaaS operator.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maas-db-config
  namespace: {{ .Values.gatewayInfraNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.awsSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: maas-db-config
  data:
    - secretKey: DB_CONNECTION_URL
      remoteRef:
        key: {{ .Values.awsSecret.key }}
        property: DB_CONNECTION_URL
