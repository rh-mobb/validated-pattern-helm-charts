{{- /*
  externalsecret-postgres-creds.yaml — credentials for the MaaS PostgreSQL database
  Why:       maas-api stores API keys, subscriptions and usage in PostgreSQL. The credentials live
             in AWS Secrets Manager (awsSecret.key) and are mapped to the env var names the RHEL
             postgresql-16 image expects (POSTGRESQL_USER / _PASSWORD / _DATABASE).
  Ordering:  sync-wave 0 — before the postgres Deployment (wave 2) that consumes it via envFrom.
             The AWS SM key must be in Terraform additional_secrets for ESO IRSA to read it.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-creds
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.awsSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: postgres-creds
  data:
    - secretKey: POSTGRESQL_USER
      remoteRef:
        key: {{ .Values.awsSecret.key }}
        property: POSTGRES_USER
    - secretKey: POSTGRESQL_PASSWORD
      remoteRef:
        key: {{ .Values.awsSecret.key }}
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRESQL_DATABASE
      remoteRef:
        key: {{ .Values.awsSecret.key }}
        property: POSTGRES_DB
