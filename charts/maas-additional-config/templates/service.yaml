{{- /*
  service.yaml — ClusterIP Service "postgres" on 5432
  Why:       Stable in-cluster DNS name for maas-api's DB_CONNECTION_URL.
  Ordering:  sync-wave 2 — with the Deployment.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
