{{- /*
  deployment.yaml — single-replica PostgreSQL for maas-api
  Why:       MaaS needs a PostgreSQL backend. RHOAI doesn't ship one, so this chart runs a small
             instance. Credentials come from the postgres-creds ExternalSecret, data lives on the
             postgres-data PVC, and pg_isready probes gate readiness.
             maas-verify checks this Deployment by name ("postgres"), so keep the name stable.
  Ordering:  sync-wave 2 — after its Secret (wave 0) and PVC (wave 1).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-creds
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/lib/pgsql/data
              name: postgres-data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
