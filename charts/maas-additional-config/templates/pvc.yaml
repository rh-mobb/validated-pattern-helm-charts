{{- /*
  pvc.yaml — persistent storage for the MaaS PostgreSQL database
  Why:       API keys and subscription data must survive pod restarts. storage.storageClass empty
             means the cluster default StorageClass.
  Ordering:  sync-wave 1 — before the postgres Deployment (wave 2) mounts it.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass }}
  {{- end }}
