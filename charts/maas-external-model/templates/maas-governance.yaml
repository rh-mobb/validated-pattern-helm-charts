apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
    openshift.io/display-name: {{ .Values.model.displayName | quote }}
    openshift.io/description: {{ .Values.model.description | quote }}
spec:
  modelRef:
    kind: ExternalModel
    name: {{ .Values.model.name }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.model.name }}-access
  namespace: {{ .Values.governanceNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
spec:
  modelRefs:
    - name: {{ .Values.model.name }}
      namespace: {{ .Values.namespace }}
  subjects:
    groups:
      - name: system:authenticated
    users: []
{{- if .Values.subscription.enabled }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .Values.model.name }}-free
  namespace: {{ .Values.governanceNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
    openshift.io/display-name: "{{ .Values.model.displayName }} Free Tier"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: {{ .Values.model.name }}
      namespace: {{ .Values.namespace }}
      tokenRateLimits:
        - limit: {{ .Values.subscription.tokenLimit }}
          window: {{ .Values.subscription.tokenWindow }}
  priority: {{ .Values.subscription.priority }}
{{- end }}
