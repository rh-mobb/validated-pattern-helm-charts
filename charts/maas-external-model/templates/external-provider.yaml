{{- /*
  external-provider.yaml — the upstream API endpoint (OpenAI, Gemini, Bedrock, ...) and its credential
  Why:       Defines where MaaS forwards requests for models from this provider and which Secret
             holds the provider API key.
  Ordering:  sync-wave 1 — after the key Secret (wave 0), before the ExternalModel (wave 2).
*/ -}}
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: {{ .Values.provider.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
spec:
  provider: {{ .Values.provider.type }}
  endpoint: {{ .Values.provider.endpoint }}
  auth:
    type: apikey
    secretRef:
      name: {{ .Values.provider.secret.name }}
