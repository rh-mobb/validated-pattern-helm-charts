{{- /*
  externalsecret.yaml — syncs the PROVIDER's API key (e.g. the OpenAI key) from AWS Secrets Manager
  Why:       MaaS calls the external provider with this key on behalf of every caller. Consumers
             never see it; they use MaaS API keys instead. The ipp-managed label lets the
             inference gateway pick up the Secret.
  Gated by:  .Values.secretStore.enabled (otherwise create provider.secret.name yourself)
  Ordering:  sync-wave 0 — before the ExternalProvider (wave 1) that references it.
             The AWS SM key must be listed in Terraform additional_secrets for ESO IRSA to read it.
*/ -}}
{{- if .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.provider.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.awsSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.provider.secret.name }}
    template:
      metadata:
        labels:
          inference.llm-d.ai/ipp-managed: "true"
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.awsSecret.key }}
        property: api-key
{{- end }}
